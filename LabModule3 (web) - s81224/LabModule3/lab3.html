<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Contact Form</title>
</head>

<body>

    <!-- Header Section -->
    <div>
        <h1>Contact Us</h1>
        <p>Welcome to our website!</p>
    </div>

    <!-- Content Section -->
    <div>
        <h2>Contact Form</h2>

        <form>
            <!-- Email Input -->
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
            <br><br>

            <!-- Date Input -->
            <label for="date">Preferred Contact Date:</label>
            <input type="date" id="date" name="date">
            <br><br>

            <!-- Range Slider -->
            <label for="satisfaction">Satisfaction Level:</label>
            <input type="range" id="satisfaction"
                   name="satisfaction" min="0" max="10">
            <br><br>

            <!-- Submit Button -->
            <input type="submit" value="Submit">
        </form>
    </div>

    <!-- Inline Calculator -->
    <div>
        <h2>Inline Calculator</h2>

        <label for="num1">First Number:</label>
        <input type="number" id="num1" value="0">

        <label for="num2">Second Number:</label>
        <input type="number" id="num2" value="0">

        <p>
            Sum:
            <output id="result">0</output>
        </p>
    </div>

    <!-- JavaScript for Calculator -->
    <script>
        const num1 = document.getElementById("num1");
        const num2 = document.getElementById("num2");
        const result = document.getElementById("result");

        function calculateSum() {
            result.value = Number(num1.value) + Number(num2.value);
        }

        num1.addEventListener("input", calculateSum);
        num2.addEventListener("input", calculateSum);
    </script>

    <!-- Footer Section -->
    <div>
        <footer>
            <p>Contact us: contact@example.com</p>
            <p>&copy; 2026 Contact Us. All rights reserved.</p>
        </footer>
    </div>

</body>
</html>
